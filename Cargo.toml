[package]
name = "setupvibe"
version = "2.0.0-alpha.1"
edition = "2024"
rust-version = "1.94"
description = "Preparação e gerenciamento de ambientes Desktop e Server"
license = "GPL-3.0-only"
repository = "https://github.com/promovaweb/setupvibe"

[features]
server-default = []

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
regex = "1"
sha2 = "0.10"
sysinfo = "0.37.2"
ratatui = "0.29.0"
crossterm = "0.28.1"

[profile.release]
lto = "thin"
strip = true

# Verificação de executáveis também deve ser rápida durante desenvolvimento.
[profile.dev.package.sha2]
opt-level = 3

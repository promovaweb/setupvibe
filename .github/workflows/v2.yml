# SetupVibe 2 CI (spec section 17).
#
# - validate: typecheck, unit tests, build, the coverage thresholds and the TUI
#   smoke test in a real terminal, on every push and pull request.
# - containers: `setupvibe auto` for real in systemd containers, run twice to
#   prove idempotency, then `check`.
# - macos and windows: the binary on real runners.
# - release: on a v2.* tag, builds every binary, writes SHA256SUMS and
#   uploads them to the GitHub Release the one-line installers read.
name: SetupVibe 2

on:
  push:
    branches: [v2]
    tags: ["v2.*"]
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - name: Unit test coverage (fails below the minimum in scripts/coverage-check.ts)
        run: bun run coverage
      - name: TUI smoke test in a real terminal (both binaries, built by validate)
        run: |
          bun run scripts/tui-smoke.ts --bin dist/setupvibe
          bun run scripts/tui-smoke.ts --bin dist/setupvibe-server

  containers:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: "debian:12", edition: desktop }
          - { system: "debian:13", edition: desktop }
          - { system: "ubuntu:24.04", edition: desktop }
          - { system: "archlinux:latest", edition: desktop }
          - { system: "linuxmintd/mint22-amd64", edition: desktop }
          - { system: "ubuntu:24.04", edition: server, root: "--as-root" }
          - { system: "debian:12", edition: server, root: "--as-root" }
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run scripts/container-test.ts --system "${{ matrix.system }}" --edition "${{ matrix.edition }}" ${{ matrix.root }}

  macos:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        # Apple Silicon runners are not assigned to this repository; their jobs
        # were cancelled before starting, so the real run uses Intel.
        runner: [macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: ./dist/setupvibe system --no-update-check
      - run: ./dist/setupvibe auto --profile essencial --dry-run
      - name: auto
        env:
          # mise reads it to avoid the anonymous GitHub API limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./dist/setupvibe auto --profile essencial --skip-network-check && ./dist/setupvibe check

  windows:
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build -- --edition desktop
      - run: .\dist\setupvibe.exe system --no-update-check
      - run: .\dist\setupvibe.exe auto --profile essencial --dry-run
      - name: PowerShell completion
        run: |
          $env:PATH = "$PWD\dist;$env:PATH"
          setupvibe completion powershell | Out-String | Invoke-Expression
          $words = (TabExpansion2 -inputScript "setupvibe ins" -cursorColumn 13).CompletionMatches.CompletionText
          if ($words -notcontains "install") { Write-Error "completion did not offer install: $words"; exit 1 }
          $topics = (TabExpansion2 -inputScript "setupvibe docs inv" -cursorColumn 18).CompletionMatches.CompletionText
          if ($topics -notcontains "inventory") { Write-Error "completion did not offer inventory: $topics"; exit 1 }
      - name: auto
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          .\dist\setupvibe.exe auto --profile essencial --skip-network-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\dist\setupvibe.exe check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: doctor reports the Windows component store
        run: |
          $out = .\dist\setupvibe.exe doctor --json | Out-String
          if ($out -notmatch '"id": "windows-health"') { Write-Error "doctor did not report windows-health: $out"; exit 1 }
          # doctor exits 3 when something else needs attention; this step only checks the finding.
          $global:LASTEXITCODE = 0

  release:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: [validate, containers]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --os="*" --cpu="*" --libc="*"
      - run: bun run release:assets
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign SHA256SUMS (keyless, GitHub OIDC)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      - name: Upload binaries, SHA256SUMS, signature and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Creates the pre-release from the CHANGELOG entry when it does not exist yet.
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            awk -v tag="## [${GITHUB_REF_NAME}]" 'index($0, tag) == 1 { on = 1; next } on && /^---/ { exit } on' CHANGELOG.md > notes.md
            gh release create "${GITHUB_REF_NAME}" --prerelease --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/setupvibe-* dist/SHA256SUMS dist/SHA256SUMS.sigstore.json dist/sbom.cdx.json --clobber
